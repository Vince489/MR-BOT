services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-config/settings.yml:/etc/searxng/settings.yml
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_INSTANCE_NAME=MR-BOT Search
    networks:
      - searxng-net

volumes:
  searxng-data:
    driver: local

networks:
  searxng-net:
    driver: bridge